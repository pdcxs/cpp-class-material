              ## 11.4 How to Define Templates?

              - &shy;<!-- .element: class="fragment" data-fragment-index="1" --><span style="color: red; font-weight: bold">Template classes</span> are a class definition pattern centered on **type parameterization**.
              - &shy;<!-- .element: class="fragment" data-fragment-index="2" -->By replacing **some** specific types (such as `int`, `string`, etc.) in the class with placeholder type parameters (such as `T`), you can support multiple data types with the same code without modifying the class logic.
              - &shy;<!-- .element: class="fragment" data-fragment-index="3" -->The compiler will instantiate specific classes based on the actual type during compilation.
              </div>
            </script>

              ## 11.4 How to Define Templates?

              - Besides classes, there are also template functions

              ```cpp [|4-9|11-14|17-21|23-27|30-32]
              #include <iostream>
              using namespace std;

              template <typename T>
              void swapValues(T &a, T &b) {
                T temp = a;
                a = b;
                b = temp;
              }

              template <typename T>
              void print(const string &prompt, const T &a, const T &b) {
                cout << prompt << ": " << a << ", " << b << endl;
              }

              int main() {
                int x = 10, y = 20;
                print("before swap", x, y);
                swapValues(x, y);
                print("after swap", x, y);
                cout << endl;

                double a = 3.14, b = 2.718;
                print("before swap", a, b);
                swapValues(a, b);
                print("after swap", a, b);
                cout << endl;

                string s1 = "Hello", s2 = "World";
                print("before swap", s1, s2);
                swapValues(s1, s2);
                print("after swap", s1, s2);

                return 0;
              }

              ```
              </div>

          <section data-markdown>
            <script type="text/template">
              <!-- .slide: class="drop" data-auto-animate data-auto-animate-id="sec-5" -->
              <div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center;" absolute="true">

              ## 11.5 Iterators

              - &shy;<!-- .element: class="fragment" data-fragment-index="1" -->The purpose of iterators:
              	- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Unified traversal method, change the container type without changing the traversal code.
              	- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Eliminate index checking, avoid out-of-bounds errors.
              - &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Uniform interface of iterators:
              	- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Container: `begin()`, `end()`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Iterator: `++`, `*`, `!=`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Iterator type: `value_type`, `difference_type`, `pointer`, `reference`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->Iterator category: `iterator_category`
              </div>
            </script>
          </section>
          <section data-markdown>
            <script type="text/template">
              <!-- .slide: class="drop" data-auto-animate data-auto-animate-id="sec-5" -->
              <div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 25pt;" absolute="true">

              ## 11.5 Iterators

              - &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`iterator_category` includes:
              	- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`std::input_iterator`: exclusive to `istream`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`std::output_iterator`: exclusive to `ostream`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`std::forward_iterator`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->`std::bidirectional_iterator`
              	- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->`std::random_access_iterator`
